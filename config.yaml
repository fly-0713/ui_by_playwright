# 多环境配置文件
# 通过环境变量 ENV 切换：set ENV=mes / set ENV=h5
# 账号密码通过环境变量注入，本地测试可设置默认值如 ${MES_USERNAME:local_user}

mes:
  base_url: "https://mes.jaka.com/"
  headless: false
  timeout: 10000
  accounts:
    - username: ${MES_USERNAME}
      password: ${MES_PASSWORD}

h5:
  base_url: "https://mes-h5.jaka.com"
  headless: false
  timeout: 10000
  accounts:
    - username: ${H5_USERNAME}
      password: ${H5_PASSWORD}


